name: Settle
options:
  bundleIdPrefix: com.praveenmurugesan
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
packages: {}
targets:
  Settle:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Settle
    info:
      path: Settle/Resources/Info.plist
      properties:
        CFBundleDisplayName: Settle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.praveenmurugesan.Settle
        INFOPLIST_KEY_CFBundleDisplayName: Settle
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DNQVHANQBU
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies: []

  SettleTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SettleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.praveenmurugesan.SettleTests
    dependencies:
      - target: Settle

schemes:
  Settle:
    build:
      targets:
        Settle: all
        SettleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SettleTests
    archive:
      config: Release
